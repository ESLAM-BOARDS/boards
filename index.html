<body>
<div id="app">
<div id="hd" hidden><button id="homeB">كل المشاريع</button><b id="ttl"></b><span class="sp"></span><span id="st"></span></div>
<section id="gate">
  <h2>لوحة مشاريعي</h2>
  <p>الصق هنا Google OAuth Client ID الخاص بك (يُحفظ في متصفحك فقط)، ثم سجّل الدخول بحساب Drive الذي تريد حفظ الملفات فيه.</p>

<script>
/* ════════ 1. core: data model, Drive API, projects, board, cards, undo hooks ════════ */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D='https://www.googleapis.com/drive/v3/files',U='https://www.googleapis.com/upload/drive/v3/files';
const PAL=['#ff7537','#fa573c','#f691b2','#cd74e6','#4986e7','#16a765','#fad165','#9fc6e7'];
const NC=['n0','n1','n2','n3','n4'];
let tok,tc,root,projs=[],P=null,B=null,dirty=0,saveT,conn=false,selId=null,els={},blobs={},pickC=PAL[4];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function showCore(id){['gate','home','bd'].forEach(s=>$('#'+s).hidden=s!==id);$('#hd').hidden=id==='gate'}
const ON_SHOW=[];   // hooks, run in order after showCore
function show(id){showCore(id);for(const f of ON_SHOW)f(id)}

/* ---------- Google auth + Drive ---------- */

async function api(url,o={},retry=1){
  const r=await fetch(url,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401&&retry){await auth();return api(url,o,0)}
  if(!r.ok)throw new Error(await r.text());return r}
const J=async(u,o)=>(await api(u,o)).json();
const list=async(q,f='files(id,name,mimeType,appProperties)')=>(await J(`${D}?q=${encodeURIComponent(q)}&fields=${f}&pageSize=200&orderBy=createdTime`)).files;
const FOLDER='application/vnd.google-apps.folder';
const mkFolder=(name,parent,color)=>J(D+'?fields=id,name,appProperties',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({name,mimeType:FOLDER,parents:parent?[parent]:undefined,appProperties:{color},folderColorRgb:color})});
async function upload(file,parent){
  const meta={name:file.name,parents:[parent]},ct=file.type||'application/octet-stream',F='&fields=id,name,mimeType,webViewLink';
  if(file.size>4e6){ // resumable for big files (audio/video)
    const r=await api(`${U}?uploadType=resumable${F}`,{method:'POST',headers:{'Content-Type':'application/json','X-Upload-Content-Type':ct},body:JSON.stringify(meta)});
    return (await api(r.headers.get('Location'),{method:'PUT',headers:{'Content-Type':ct},body:file})).json()}
  const b='b'+uid(),body=new Blob([`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${ct}\r\n\r\n`,file,`\r\n--${b}--`]);
  return J(`${U}?uploadType=multipart${F}`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})}
const blobURL=id=>blobs[id]||(blobs[id]=api(`${D}/${id}?alt=media`).then(r=>r.blob()).then(URL.createObjectURL));

  if(!arr.length)return;const files=arr.filter(c=>(c.t==='file'||c.t==='folder')&&c.fid).concat(arr.filter(c=>c.t==='pad').flatMap(c=>(c.imgs||[]).map(i=>({id:c.id+':'+i.id,fid:i.fid}))));

  const fail=new Set();
  await Promise.all(files.map(c=>rmDrive(c.fid).catch(e=>{if(!/404|notFound/.test(e.message)){fail.add(c.id);console.error(e)}})));
  const ids=new Set(arr.filter(c=>!fail.has(c.id)).map(c=>c.id));
  B.lines.forEach(l=>l.p&&l.p.forEach((e,i)=>{if(e.c&&ids.has(e.c)){const q=ep(e);l.p[i]={x:q[0],y:q[1]}}}));
  B.cards=B.cards.filter(c=>!ids.has(c.id));ids.forEach(i=>SEL.delete(i));save();render();selBar();
  toast(fail.size?`تعذر حذف ${fail.size} ملف من Drive — لم تُحذف بطاقاته`:files.length?'✓ حُذف من اللوحة ونُقل إلى سلة Drive':'✓ تم الحذف')}

const SC='https://www.googleapis.com/auth/drive.file';
function saveTok(r){tok=r.access_token;try{localStorage.setItem('tk',JSON.stringify({t:tok,e:Date.now()+(r.expires_in-120)*1000}));localStorage.setItem('signed','1')}catch(e){}if(!localStorage.getItem('hint'))fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+tok}}).then(x=>x.json()).then(j=>{if(j.user&&j.user.emailAddress)localStorage.setItem('hint',j.user.emailAddress)}).catch(()=>{})}
function tokReq(prompt){return new Promise((ok,no)=>{
  const t=google.accounts.oauth2.initTokenClient({client_id:localStorage.getItem('cid'),scope:SC,prompt,hint:localStorage.getItem('hint')||undefined,
    callback:r=>r.error?no(r):(saveTok(r),ok()),error_callback:e=>no(e)});
  t.requestAccessToken({prompt})})}
async function auth(interactive){
  const seen=localStorage.getItem('signed');
  if(!interactive&&seen){try{return await tokReq('none')}catch(e){}}
  return tokReq(seen?'':'consent')}

  pulling=1;try{const v=await remoteVer();if(v!==String(P.bver)){await applyRemote(v,false);toast('↻ تم تحديث اللوحة من جهاز آخر')}}catch(e){}finally{pulling=0}}
async function pollHome(){
  if(document.hidden||P||$('#home').hidden||!root)return;
  try{const f=(await list(`'${root}' in parents and mimeType='${FOLDER}' and trashed=false`)).filter(p=>p.name!=='القوالب'),sig=f.map(x=>x.id+'|'+x.name+'|'+((x.appProperties||{}).color||'')).join(',');
    if(window.__hs===undefined){window.__hs=sig;return}if(sig!==window.__hs){window.__hs=sig;openHome()}}catch(e){}}
setInterval(()=>{pullRemote();pollHome()},9000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pullRemote();pollHome()}});addEventListener('focus',()=>{pullRemote();pollHome()});addEventListener('online',()=>{pullRemote();pollHome()});
</script>
